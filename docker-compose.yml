# Deploy satu mesin: `docker compose up -d --build`
#
# Dua service:
#   migrate — menjalankan `prisma migrate deploy` sekali (image builder, punya
#             Prisma CLI + folder prisma/migrations), lalu selesai.
#   app     — image runtime (standalone, tanpa Prisma CLI), menunggu migrate
#             sukses sebelum start.
#
# Database dan foto barang ada di volume bernama, bukan di dalam container —
# `docker compose down` (tanpa -v) tidak menghapus data.

services:
  migrate:
    build:
      context: .
      target: builder
    command: npx prisma migrate deploy
    env_file: .env
    environment:
      DATABASE_URL: file:/data/app.db
    volumes:
      - db-data:/data
    restart: "no"

  app:
    build:
      context: .
      target: runner
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    environment:
      DATABASE_URL: file:/data/app.db
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - db-data:/data
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db-data:
  uploads:
